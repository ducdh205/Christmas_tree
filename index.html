<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="An ASCII Christmas tree — slowly turning, softly glowing." />
    <title>ASCII Christmas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="aura" aria-hidden="true"></div>
      <canvas id="scene" aria-hidden="true"></canvas>
      <canvas id="glow" aria-hidden="true"></canvas>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <h1 class="sr-only">Merry Christmas</h1>

      <div class="caption" id="caption">
        <p class="subtitle" id="subtitle">and a Happy New Year</p>
        <p class="countdown" id="countdown"></p>
      </div>

      <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Toggle music">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="label">music</span>
      </button>

      <p class="hint" id="hint">drag to spin &nbsp;·&nbsp; tap for sparkles</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

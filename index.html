<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="Một cây thông Noel bằng ký tự, gửi dilahn." />
    <title>Merry Christmas, dilahn</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="aura" aria-hidden="true"></div>
      <canvas id="scene" aria-hidden="true"></canvas>
      <canvas id="glow" aria-hidden="true"></canvas>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <h1 class="sr-only">Merry Christmas, dilahn</h1>

      <div class="caption" id="caption">
        <p class="subtitle" id="subtitle">and a Happy New Year</p>
        <p class="countdown" id="countdown"></p>
      </div>

      <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Toggle music">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="label">music</span>
      </button>
      <button class="next" id="next" type="button" aria-label="Bài tiếp theo" title="Bài tiếp theo">
        <span aria-hidden="true">›</span>
      </button>
      <p class="now-playing" id="now-playing" aria-live="polite"></p>

      <p class="hint" id="hint">chạm vào hộp quà để mở &nbsp;·&nbsp; kéo để xoay cây</p>
    </main>

    <div class="gate" id="gate" role="button" tabindex="0" aria-label="Mở quà">
      <p class="gate-kicker">merry christmas</p>
      <p class="gate-title">Gửi <em>dilahn</em></p>
      <p class="gate-line" aria-hidden="true">· · ✦ · ·</p>
      <p class="gate-hint">…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
